[/Script/UnrealEd.ProjectPackagingSettings]
; FlexXR's own materials and meshes are referenced only by hardcoded FSoftObjectPath strings in
; C++ component constructors (they cannot be hard references — a rooted asset makes
; MaterialEditingLibrary assert, which takes the editor down when Tools/regen_fxr_materials.py
; runs). A soft path in code leaves no asset-registry dependency edge, so the cooker never sees
; these packages and a device build shipped with none of them: no ray material, no reticle, no
; teleport arc, no comfort vignette, no outline hull. Name the plugin content folders explicitly.
; Listed per folder, not as the bare mount root "/FlexXR": the cooker resolves these through
; FPackageName::TryConvertLongPackageNameToFilename, which matches against the registered root
; "/FlexXR/" and is not reliable for the root with no child path. An entry that fails to resolve
; only logs a warning and cooks nothing, so this must be the form that is certain.
; NOTE: a new content folder in the plugin must be added here or it will not ship on device.
+DirectoriesToAlwaysCook=(Path="/FlexXR/Materials")
+DirectoriesToAlwaysCook=(Path="/FlexXR/Meshes")
