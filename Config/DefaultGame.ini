[/Script/UnrealEd.ProjectPackagingSettings]
; The plugin's materials and meshes are only referenced by FSoftObjectPath strings in C++
; constructors, which leaves the cooker no dependency to follow, so none of them shipped in
; the first device build. They cannot be hard refs: rooting the asset trips the
; MaterialEditingLibrary assert and kills the editor during regen_fxr_materials.py.
; Per folder, not the bare "/FlexXR" root. TryConvertLongPackageNameToFilename matches
; against the registered "/FlexXR/", and a path that fails to resolve just warns and cooks
; nothing. Add any new plugin content folder here or it will not ship.
+DirectoriesToAlwaysCook=(Path="/FlexXR/Materials")
+DirectoriesToAlwaysCook=(Path="/FlexXR/Meshes")
