; FlexXR device profile overrides.
;
; DefaultEngine.ini asks for foveated rendering to be off (xr.VRS.FoveationLevel=0,
; xr.VRS.DynamicFoveation=False) and that request was being silently discarded: a device profile
; applies its CVars at ECVF_SetByDeviceProfile, which outranks a project setting, and the engine's
; own [Android_OpenXR DeviceProfile] — the parent every Quest variant inherits from — sets
; xr.VRS.DynamicFoveation=1 and r.Vulkan.AllowFDMOffset=1. This makes the engine honour what the
; project already asked for.
;
; Overriding the parent profile rather than Meta_Quest_3 covers Quest 2, 3, 3S and Pro at once.
; The '-CVars=' lines remove the engine's inherited entries by exact string match before the
; replacements are added, so the result does not depend on which duplicate the engine applies last.
; Verified on a Quest 3: the device log reports "Pushing Device Profile CVar:
; [[xr.VRS.DynamicFoveation:0 -> 0]]", i.e. the override replaced the inherited 1.
;
; This is a settings-correctness change, NOT a bug fix. It was first tried as a candidate fix for
; black tearing at the outer edge of the right eye on Quest; with both of these off the artifact
; still occurs, so foveation is not its cause. See Docs/PROJECT_STATUS.md §8.
;
; Phase 5 note: foveation is a genuine performance win on a tiler and nothing currently justifies
; paying to keep it off, so whether this override should survive optimisation is an open question —
; it preserves the project's stated intent, not a measured benefit.
; r.Vulkan.VRSFormat is deliberately left as the engine sets it. Note that it is NOT inert while
; foveation is off: with these settings the RHI still reports image-based VRS selected via
; EXTFragmentDensityMap at a 16x16 tile size.

[Android_OpenXR DeviceProfile]
-CVars=xr.VRS.DynamicFoveation=1
-CVars=r.Vulkan.AllowFDMOffset=1
+CVars=xr.VRS.DynamicFoveation=0
+CVars=r.Vulkan.AllowFDMOffset=0
