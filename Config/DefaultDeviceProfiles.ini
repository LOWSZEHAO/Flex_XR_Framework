; DefaultEngine.ini asks for foveation off and doesn't get it. Device profiles outrank project
; settings, and the engine's [Android_OpenXR DeviceProfile], which every Quest variant inherits
; from, sets xr.VRS.DynamicFoveation=1 and r.Vulkan.AllowFDMOffset=1. Overriding the parent covers
; Quest 2, 3, 3S and Pro at once. The -CVars lines strip the inherited entries by exact match
; first, so it doesn't matter which duplicate the engine applies last. Device log confirms it
; takes: "Pushing Device Profile CVar: [[xr.VRS.DynamicFoveation:0 -> 0]]".
;
; This is config correctness, not a bug fix. I tried it against the right-eye edge artifact and
; the artifact survives it, so foveation isn't the cause. See Docs/PROJECT_STATUS.md.
;
; Worth another look in Phase 5. Foveation is a real win on a tiler and nothing here justifies
; paying to keep it off. Note r.Vulkan.VRSFormat is left alone and is NOT inert with foveation
; off: the RHI still picks image-based VRS at a 16x16 tile size.

[Android_OpenXR DeviceProfile]
-CVars=xr.VRS.DynamicFoveation=1
-CVars=r.Vulkan.AllowFDMOffset=1
+CVars=xr.VRS.DynamicFoveation=0
+CVars=r.Vulkan.AllowFDMOffset=0
